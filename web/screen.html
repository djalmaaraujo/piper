<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>piper screen</title>
  <style>
    :root { --bg: #0f172a; --fg: #e6e8f0; --muted: #64748b; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    /* share centered on the page */
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
    }
    #shot {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      background: #000;
    }
    #status {
      position: fixed; top: 8px; right: 12px; z-index: 10;
      font: 12px ui-monospace, monospace; color: var(--muted);
      background: rgba(15,23,42,.7); padding: 2px 8px; border-radius: 6px;
    }
    #status .sep { margin: 0 8px; color: #334155; }
    #status .meta { color: #94a3b8; }
    #brand { position: fixed; bottom: 12px; right: 12px; z-index: 10;
             opacity: .4; transition: opacity .15s; }
    #brand:hover { opacity: .9; }
    #brand img { height: 48px; display: block; }
  </style>
</head>
<body>

  </a>

  <div id="stage"><img id="shot" alt="shared window"></div>

  <script>
    const base = location.pathname.replace(/\/+$/, "");
    const shot = document.getElementById("shot");

    // Client-side jitter buffer: holds a little playback so uneven frame
    // arrival (e.g. over a tunnel) plays at a steady cadence with catch-up.
    // It can't raise the frame rate — only even out the timing. A sensible
    // default is baked in; override with ?buffer=<ms> (and ?buffer=0 = live).
    const DEFAULT_BUFFER_MS = 400;
    const bufQ = new URLSearchParams(location.search).get("buffer");
    const bufferMs = bufQ === null ? DEFAULT_BUFFER_MS : Math.max(0, parseInt(bufQ, 10) || 0);

    (async function loadInfo() {
      try {
        const r = await fetch(base + "/info");
        if (!r.ok) return;
        const j = await r.json();
        if (j.id) { document.getElementById("pid").textContent = "ID: " + j.id; document.title = "piper · " + j.id; }
        if (j.started) document.getElementById("since").textContent = "started " + j.started;
      } catch (_) {}
    })();

    function indexOf(buf, needle, from) {
      outer: for (let i = from || 0; i <= buf.length - needle.length; i++) {
        for (let j = 0; j < needle.length; j++) if (buf[i + j] !== needle[j]) continue outer;
        return i;
      }
      return -1;
    }
    const BOUND = new TextEncoder().encode("--piperframe");
    const CRLF2 = new TextEncoder().encode("\r\n\r\n");

    const queue = [];          // object URLs waiting to be shown
    let ema = 150;             // EMA of inter-frame arrival (ms)
    let lastArrival = 0;

    function show(url) {
      const old = shot.src;
      shot.src = url;
      if (old.startsWith("blob:")) URL.revokeObjectURL(old);
    }
    function onFrame(jpeg) {
      const url = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));
      const now = performance.now();
      if (lastArrival) ema = 0.8 * ema + 0.2 * (now - lastArrival);
      lastArrival = now;
      queue.push(url);
      if (bufferMs <= 0) drain(1);                 // live
      const cap = Math.max(60, Math.round((bufferMs / Math.max(ema, 1)) * 3));
      while (queue.length > cap) URL.revokeObjectURL(queue.shift());
    }
    function drain(n) { for (let i = 0; i < n && queue.length; i++) show(queue.shift()); }

    // Steady-cadence player for buffered mode.
    function tick() {
      const target = Math.max(1, Math.round(bufferMs / Math.max(ema, 1)));
      if (queue.length >= target) {
        while (queue.length > target * 2) URL.revokeObjectURL(queue.shift()); // catch up
        drain(1);
      }
      setTimeout(tick, Math.max(ema, 30));
    }
    if (bufferMs > 0) tick();

    // Parse the multipart MJPEG stream frame by frame.
    async function play() {
      let buf = new Uint8Array(0);
      const dec = new TextDecoder();
      try {
        const res = await fetch(base + "/stream");
        if (!res.ok || !res.body) throw new Error("bad stream");
        const reader = res.body.getReader();
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          const next = new Uint8Array(buf.length + value.length);
          next.set(buf); next.set(value, buf.length); buf = next;
          for (;;) {
            const b = indexOf(buf, BOUND, 0);
            if (b < 0) break;
            const h = indexOf(buf, CRLF2, b);
            if (h < 0) break;
            const m = dec.decode(buf.subarray(b, h)).match(/Content-Length:\s*(\d+)/i);
            if (!m) { buf = buf.subarray(h + 4); continue; }
            const len = +m[1], start = h + 4;
            if (buf.length < start + len) break;     // wait for the whole frame
            onFrame(buf.subarray(start, start + len));
            buf = buf.subarray(start + len);
          }
        }
      } catch (_) {
        // Fallback: let the browser's native MJPEG handling drive the <img>.
        shot.src = base + "/stream";
        return;
      }
      setTimeout(play, 1000); // reconnect if the stream ends
    }
    play();
  </script>
</body>
</html>
