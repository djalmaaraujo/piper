<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>piper screen</title>
  <style>
    :root { --bg: #0f172a; --fg: #e6e8f0; --muted: #64748b; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    /* share centered on the page */
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; box-sizing: border-box;
    }
    #shot {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
      background: #000;
    }
    #status {
      position: fixed; top: 8px; right: 12px; z-index: 10;
      font: 12px ui-monospace, monospace; color: var(--muted);
      background: rgba(15,23,42,.7); padding: 2px 8px; border-radius: 6px;
    }
    #status .sep { margin: 0 8px; color: #334155; }
    #status .meta { color: #94a3b8; }
    #brand { position: fixed; bottom: 12px; right: 12px; z-index: 10;
             opacity: .4; transition: opacity .15s; }
    #brand:hover { opacity: .9; }
    #brand img { height: 48px; display: block; }
  </style>
</head>
<body>

  <div id="stage"><img id="shot" alt="shared window"></div>

  <script>
    const base = location.pathname.replace(/\/+$/, "");
    // MJPEG multipart auto-refreshes the <img> with each new frame.
    document.getElementById("shot").src = base + "/stream";

    (async function loadInfo() {
      try {
        const r = await fetch(base + "/info");
        if (!r.ok) return;
        const j = await r.json();
        if (j.id) { document.getElementById("pid").textContent = "ID: " + j.id; document.title = "piper · " + j.id; }
        if (j.started) document.getElementById("since").textContent = "started " + j.started;
      } catch (_) {}
    })();
  </script>
