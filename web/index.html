  <title>piper</title>
  <style>
    :root { --bg: #0f172a; --fg: #e6e8f0; --muted: #64748b; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    #log {
      box-sizing: border-box;
      height: 100%;
      overflow-y: auto;
      padding: 16px 18px 40px;
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
      /* scrollbar hidden, content still scrolls */
      scrollbar-width: none;
    }
    #log::-webkit-scrollbar { display: none; }

    #status {
      position: fixed; top: 8px; right: 12px; z-index: 10;
      font: 12px ui-monospace, monospace; color: var(--muted);
      background: rgba(15,23,42,.7); padding: 2px 8px; border-radius: 6px;
    }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
           background: #22c55e; margin-right: 6px; vertical-align: middle; }
    .dot.off { background: #ef4444; }

    #brand { position: fixed; bottom: 8px; right: 12px; z-index: 10;
             opacity: .4; transition: opacity .15s; }
    #brand:hover { opacity: .9; }
    #brand img { height: 48px; display: block; }
  </style>
</head>

  <pre id="log"></pre>

  <script>
    const log = document.getElementById("log");
    const dot = document.getElementById("dot");
    const stateEl = document.getElementById("state");
    const setState = (ok, txt) => { dot.classList.toggle("off", !ok); stateEl.textContent = txt; };

    // Strip terminal control sequences — keep it plain & dependency-free:
    // CSI (colors, cursor), OSC (titles), lone ESC, BEL/EOT, and carriage returns.
    const CSI = /\x1b\[[0-?]*[ -/]*[@-~]/g;
    const OSC = /\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g;
    const OTHER = /[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g; // controls except \t(09) \n(0a)
    const clean = (s) => s.replace(OSC, "").replace(CSI, "").replace(/\r/g, "").replace(OTHER, "");

    function atBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    }

    function append(text) {
      const stick = atBottom();
      log.appendChild(document.createTextNode(text));
      // cap DOM size so very long streams don't grow memory unbounded
      while (log.childNodes.length > 4000) log.removeChild(log.firstChild);
      if (stick) log.scrollTop = log.scrollHeight;
    }

    async function connect() {
      try {
        const res = await fetch("/stream", { headers: { Accept: "text/plain" } });
        if (!res.ok || !res.body) throw new Error("bad response");
        setState(true, "connected");
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          append(clean(dec.decode(value, { stream: true })));
        }
      } catch (_) { /* retry */ }
      setState(false, "disconnected — retrying");
      setTimeout(connect, 1000);
    }
    connect();
  </script>
