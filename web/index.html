  <script src="/xterm.js"></script>
  <script src="/xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({
      convertEol: false,      // PTY output already carries CRLF
      cursorBlink: false,
      disableStdin: true,
      scrollback: 10000,
      fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace",
      fontSize: 13,
      theme: { background: "#0f172a", foreground: "#e2e8f0" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();
    addEventListener("resize", () => fit.fit());

    const dot = document.getElementById("dot");
    const stateEl = document.getElementById("state");
    const setState = (ok, txt) => { dot.classList.toggle("off", !ok); stateEl.textContent = txt; };

    async function connect() {
      try {
        const res = await fetch("/stream", { headers: { Accept: "text/plain" } });
        if (!res.ok || !res.body) throw new Error("bad response");
        setState(true, "connected");
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          term.write(dec.decode(value, { stream: true }));
        }
      } catch (_) { /* fallthrough to retry */ }
      setState(false, "disconnected — retrying");
      setTimeout(connect, 1000);
    }
    connect();
  </script>
